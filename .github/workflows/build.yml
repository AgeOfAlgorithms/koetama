# Builds Koetama (the Rust app, app/) on GitHub: Windows (the folder + its installer) and Linux (a .tar.gz), with
# SHA256SUMS.txt. Every push to main that changes the app (not the docs): the builds as artifacts (Actions tab -> the
# run -> Artifacts). The Rust build cache is kept between runs. A tag v<version> (matching app/Cargo.toml's version):
# also a DRAFT release with the files - nothing is public until it is published by hand. Code signing (SignPath) slots
# in after the Windows build once the project is accepted.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'engine/export_lid.py', 'build.py', 'installer/**', '.github/workflows/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:                       # (a newer push replaces a build still running)
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          prefix-key: v2-rust
      - name: sherpa-onnx's libraries, downloaded here (SHERPA_ONNX_LIB_DIR - not by its build script into target/, where a restored build cache left them broken)
        shell: bash
        run: |
          A=sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$A.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$A.tar.bz2"
          tar -xjf "$A.tar.bz2"
          ls "$A/lib"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/$A/lib" >> "$GITHUB_ENV"
      - name: sherpa-onnx's DLLs next to the test programs (a restored build cache skips the build script that copies them; Windows would load System32's older onnxruntime.dll from PATH)
        shell: bash
        run: |
          for d in app/target/debug/deps app/target/debug/examples app/target/debug app/target/release; do
            mkdir -p "$d"
            cp "$SHERPA_ONNX_LIB_DIR"/*.dll "$d"/
          done
      - name: The language detector (SpeechBrain VoxLingua107 ECAPA as ONNX)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy onnxruntime
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install speechbrain onnx
          python engine/export_lid.py
      - name: Tests (against the Python reference's answers, app/fixtures)
        working-directory: app
        run: cargo test --workspace --locked
      - name: Inno Setup (if the runner has none)
        shell: pwsh
        run: if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
      - name: Build and the installer (Inno Setup)
        run: python build.py
      - name: The build runs (the window, sound, ONNX, the detector, HTTPS)
        shell: bash
        run: ./dist/Koetama/Koetama.exe --selftest
      - name: The installer installs, the installed app runs, the uninstaller removes it (and the models)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Koetama-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Koetama"
          $p = Start-Process "$app\Koetama.exe" -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "installed selftest exit code $($p.ExitCode)" }
          # (the player's data: the uninstaller asks, Yes by default - a silent uninstall removes it)
          $data = "$env:LOCALAPPDATA\Koetama"
          New-Item -ItemType Directory -Force "$data\models\some-model" | Out-Null
          Set-Content "$data\models\some-model\model.onnx" 'pretend'
          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$app\Koetama.exe") { throw 'the uninstaller left Koetama.exe' }
          if (Test-Path $data) { throw 'the uninstaller left the models and settings (%LOCALAPPDATA%\Koetama)' }
      - uses: actions/upload-artifact@v4
        with:
          name: koetama-windows
          path: |
            dist/Koetama-Setup*.exe
            dist/SHA256SUMS.txt
      - name: Draft release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/Koetama-Setup*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          prefix-key: v2-rust
      - name: sherpa-onnx's libraries, downloaded here (SHERPA_ONNX_LIB_DIR - not by its build script into target/, where a restored build cache left them broken)
        shell: bash
        run: |
          A=sherpa-onnx-v1.13.8-linux-x64-shared-lib
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$A.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/$A.tar.bz2"
          tar -xjf "$A.tar.bz2"
          ls "$A/lib"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/$A/lib" >> "$GITHUB_ENV"
          # (the test programs find them here too: a restored build cache skips sherpa-onnx's build script, which
          #  otherwise copies them next to each test program)
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/$A/lib" >> "$GITHUB_ENV"
      - name: System libraries (ALSA for sound; a virtual screen and GL for the selftest's window)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libx11-xcb1
      - name: The language detector
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy onnxruntime
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install speechbrain onnx
          python engine/export_lid.py
      - name: Tests (against the Python reference's answers, app/fixtures)
        working-directory: app
        run: cargo test --workspace --locked
      - name: Build
        run: python build.py --no-installer
      - name: The build runs (the window on a virtual screen, sound, ONNX, the detector, HTTPS)
        run: |
          mkdir -p /tmp/try && tar -xzf dist/Koetama-*-linux.tar.gz -C /tmp/try
          xvfb-run -a /tmp/try/Koetama/Koetama --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: koetama-linux
          path: |
            dist/Koetama*linux.tar.gz
            dist/SHA256SUMS.txt
      - name: Draft release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/Koetama*linux.tar.gz

  sums:
    # one SHA256SUMS.txt for the release, from both builds
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: SHA256SUMS.txt
        run: |
          cd art
          sha256sum koetama-windows/Koetama-Setup*.exe koetama-linux/Koetama*linux.tar.gz | sed 's#  koetama-[a-z]*/#  #' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: SHA256SUMS.txt
