# Koetama's voice relay: `npm run deploy` (from relay/, with the `relay` conda env: Node.js 22)
name = "koetama-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# (SQLite-backed Durable Objects: the kind the Workers Free plan allows)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# New connections per IP address (Workers Rate Limiting): a reconnecting player makes a few a minute, a hub one per
# hosted player; a flood of rooms or connections from one address is refused before any room is made.
[[ratelimits]]
name = "UPGRADES"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# (no request logs: they would keep room names, player numbers and addresses - PRIVACY.md says the relay stores
#  nothing)
[observability]
enabled = false
