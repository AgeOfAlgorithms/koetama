# The noise suppressors Koetama might use, benchmarked as Koetama would run them (bench/denoise.py runs this;
# docs/noise-suppression.md). Its own workspace: none of these dependencies reach the app until one is chosen.
[package]
name = "denoise_bench"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# RNNoise in pure Rust (BSD-3, its weights built in)
nnnoiseless = { version = "0.5", default-features = false }
# DPDFNet through sherpa-onnx's streaming denoiser: the version the app already ships
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
# DeepFilterNet 3 through its own Rust library and tract (MIT/Apache-2.0; the last commit, 2024-10-17)
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"] }
ndarray = "0.15"
hound = "3.5"
serde_json = "1"

[profile.release]
debug = false
