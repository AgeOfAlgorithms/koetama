# Koetama in Rust: one program (crates/koetama) built from small crates, each the port of one part of engine/
# (the Python app, kept as the reference: app/fixtures/make_fixtures.py writes its answers for the tests here).
# DESIGN.md has the crates, their interfaces and which Python they replace.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.6"
edition = "2021"
license = "MIT"
authors = ["AgeOfAlgorithms"]
repository = "https://github.com/AgeOfAlgorithms/koetama"

[workspace.dependencies]
kd-common = { path = "crates/kd-common" }
kd-audio = { path = "crates/kd-audio" }
kd-speech = { path = "crates/kd-speech" }
kd-games = { path = "crates/kd-games" }
kd-update = { path = "crates/kd-update" }
kd-voice = { path = "crates/kd-voice" }
kd-translate = { path = "crates/kd-translate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
ed25519-dalek = "3"
scrypt = { version = "0.11", default-features = false }
cpal = "0.18"
rubato = "5"
hound = "3.5"
regex = "1"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_Security"] }
# noise suppression for the voice sent (kd-voice/src/denoise.rs; docs/noise-suppression.md): RNNoise in pure Rust
# (BSD-3), and DeepFilterNet 3 through its own library at its last commit (MIT/Apache-2.0) - with tract pinned to the
# 0.21.4 it was built with (later 0.21.x moved to ndarray 0.16 and no longer build with it)
nnnoiseless = { version = "0.5", default-features = false }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"] }
ndarray = "0.15"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "accesskit"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2          # (dependencies optimised in debug builds too: the mixer and the speech glue run in real time)

[profile.dev.package.kd-audio]
opt-level = 2          # (the mixer runs in the audio callback: real time even in a debug build)

# (DeepFilterNet 3's runtime, tract, even in debug builds: optimised - real time needs it - and without debug assertions,
#  one of which makes its model fail to load in a debug build: "running pass codegen")
[profile.dev.package.tract-core]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-onnx-opl]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-nnef]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-pulse]
opt-level = 2
debug-assertions = false
[profile.dev.package.tract-pulse-opl]
opt-level = 2
debug-assertions = false
[profile.dev.package.deep_filter]
opt-level = 2
debug-assertions = false
