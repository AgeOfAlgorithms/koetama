[package]
name = "kd-voice"
description = "Koetama: real voices between players - the relay client, end-to-end encryption, Opus, the jitter buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kd-common.workspace = true
kd-audio.workspace = true
serde_json.workspace = true
# (Opus: a port of libopus 1.6 to Rust - no C compiler or CMake on any platform, nothing to link. Not unsafe-libopus:
# its SILK loss concealment gives full-scale noise)
opus-rs = "0.1.37"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
# (the relay: a WebSocket over TLS, blocking, on the voice thread; rustls with ring, as ureq's)
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "0.26"
