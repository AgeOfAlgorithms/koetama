[package]
name = "kotodama"
description = "Kotodama: proximity voice chat with live speech to text"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kotodama"
path = "src/main.rs"

[dependencies]
kd-common.workspace = true
kd-audio.workspace = true
kd-speech.workspace = true
kd-games.workspace = true
kd-update.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
sherpa-onnx.workspace = true
clap = { version = "4", features = ["derive"] }

[build-dependencies]
winresource = "0.1"
