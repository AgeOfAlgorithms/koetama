[package]
name = "koetama"
description = "Koetama: proximity voice chat with live speech to text"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "koetama"
path = "src/main.rs"

[dependencies]
kd-common.workspace = true
kd-audio.workspace = true
kd-speech.workspace = true
kd-games.workspace = true
kd-update.workspace = true
kd-voice.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs"] }
sherpa-onnx.workspace = true
clap = { version = "4", features = ["derive"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"
